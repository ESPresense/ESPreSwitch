name: SwitchPresense app.bin build

on:
  push:
    branches: [main, espresense]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # Stays on IDF v4.4: this stage binary is what runs on stock SwitchBot plugs, and it is the
    # toolchain upstream SwitchbOTA was proven with. The payload it installs is built separately.
    - name: esp-idf build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: v4.4
        target: esp32c3
        path: 'espressif'

    - name: Package app.bin
      run: |
        cp espressif/build/switchpresense.bin app.bin
        md5sum app.bin | cut -d' ' -f1 > app.bin.md5
        echo "app.bin $(stat -c%s app.bin) bytes, md5 $(cat app.bin.md5)"

    - uses: actions/upload-artifact@v4
      with:
        name: app.bin
        path: |
          app.bin
          app.bin.md5

    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app.bin
          app.bin.md5
